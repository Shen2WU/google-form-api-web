<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸入數字到 Google 表單</title>
</head>
<body>
    <h2>請輸入數字</h2>
    <input type="number" id="number1Input" placeholder="輸入第一個數字">
    <input type="number" id="number2Input" placeholder="輸入第二個數字">
    <button onclick="sendData()">送出</button>

    <script>
        function sendData() {
            var number1 = document.getElementById("number1Input").value;
            var number2 = document.getElementById("number2Input").value;
            var url = "https://script.google.com/macros/s/AKfycbx6_pfDLPG5nOLThNNEmk5DzpvN2GswV1yhc6mBYiFWa5NWImJXdKQlec1XYCDJJzsebg/exec"; 

            fetch(url, {
                method: "POST",
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: "2,3"
            })
            .then(response => response.json())
            .then(data => alert("成功寫入"))
            .catch(error => {
                console.error("錯誤:", error);
                alert("寫入失敗，請檢查網路連接或輸入內容");
            });
        }
    </script>
</body>
</html>
