<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸入組別到 Google 表單</title>
    <style>
        /* 你的樣式不變 */
    </style>
</head>
<body>
    <h1>題目 DEMO 輸入</h1>

    <div class="card">
        <h2>第一題 DEMO</h2>
        <input type="number" id="number1Input" placeholder="輸入第一題完成組別">
        <button onclick="sendData(1)">送出</button>
    </div>

    <div class="card">
        <h2>第二題 DEMO</h2>
        <input type="number" id="number2Input" placeholder="輸入第二題完成組別">
        <button onclick="sendData(2)">送出</button>
    </div>

    <div class="card">
        <h2>第三題 DEMO</h2>
        <input type="number" id="number3Input" placeholder="輸入第三題完成組別">
        <button onclick="sendData(3)">送出</button>
    </div>

    <div class="card">
        <h2>第四題 DEMO</h2>
        <input type="number" id="number4Input" placeholder="輸入第四題完成組別">
        <button onclick="sendData(4)">送出</button>
    </div>

    <script>
        // 讀取環境變數中的 SCRIPT_URL
        const SCRIPT_URL = process.env.SCRIPT_URL;  // 如果你在 Cloudflare Pages 設定了此環境變數

        function sendData(questionNumber) {
            let col = 1;
            var number;
            switch (questionNumber) {
                case 1:
                    number = document.getElementById("number1Input").value;
                    col = 1;
                    break;
                case 2:
                    number = document.getElementById("number2Input").value;
                    col = 2;
                    break;
                case 3:
                    number = document.getElementById("number3Input").value;
                    col = 3;
                    break;
                case 4:
                    number = document.getElementById("number4Input").value;
                    col = 4;
                    break;
                default:
                    alert("無效的題目編號");
                    return;
            }

            // 發送請求到 Google Apps Script
            fetch(SCRIPT_URL, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    number: number,
                    col: col
                })
            })
            .then(response => response.json())
            .then(data => alert("✅ 成功寫入第 " + questionNumber + " 題，組別數字：" + data.number))
            .catch(error => {
                console.error("錯誤:", error);
                alert("❌ 寫入失敗，請檢查網路連接或輸入內容");
            });
        }
    </script>
</body>
</html>
